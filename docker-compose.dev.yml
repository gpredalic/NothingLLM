services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nlm
      POSTGRES_PASSWORD: nlm
      POSTGRES_DB: nothingllm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlm -d nothingllm"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      POSTGRES_URL: postgres://nlm:nlm@postgres:5432/nothingllm?sslmode=disable
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      SESSION_SECRET: dev-secret
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: sh -c "cd /app && go run ./cmd/nothingllm"

  web:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api

volumes:
  postgres_data:
  qdrant_data:
  frontend_node_modules: